version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mobimart-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-secret}
    networks:
      - mobimart-net

  redis:
    image: redis:alpine
    container_name: mobimart-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - mobimart-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobimart-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-secret}@mongodb:27017/mobimart?authSource=admin
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:80}
      # (Note: JWT and Cloudinary keys should ideally be passed via .env file or secrets, not hardcoded here)
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis
    networks:
      - mobimart-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: mobimart-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mobimart-net

volumes:
  mongodb_data:

networks:
  mobimart-net:
    driver: bridge
